services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-gepeto}
      POSTGRES_USER: ${POSTGRES_USER:-gepeto}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - gepeto_pgdata:/var/lib/postgresql/data
      - ./api/app/schema.sql:/docker-entrypoint-initdb.d/010-schema.sql:ro
      - ./api/app/seed.sql:/docker-entrypoint-initdb.d/020-seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-gepeto} -d ${POSTGRES_DB:-gepeto}"]
      interval: 10s
      timeout: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - gepeto_redis:/data
  api:
    build: ./api
    restart: unless-stopped
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    ports:
      - "8000:8000"
volumes:
  gepeto_pgdata:
  gepeto_redis:
